{% extends "base.html" %}

{% block title %}Pembayaran Order #{{ order.daily_number }}{% endblock %}

{% block content %}
<div class="header">
    <h1>Pembayaran</h1>
    <p>Order #{{ order.daily_number }}</p>
</div>

<div class="container">
    <div style="background: var(--cafe-card); border-radius:12px; padding:16px; margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; font-weight:500;">
            <span>Total bayar</span>
            <span>Rp{{ "{:,.0f}".format(total) }}</span>
        </div>
    </div>

    <form method="POST">
        <label style="font-size: 13px; color: var(--cafe-wood-mid); display:block; margin-bottom:8px;">Metode pembayaran</label>
        <div style="display:flex; gap:8px; margin-bottom:16px;">
            <label style="flex:1; text-align:center; border:1px solid #D8C4A8; border-radius:8px; padding:10px; cursor:pointer;">
                <input type="radio" name="method" value="tunai" checked style="margin-right:4px;">Tunai
            </label>
            <label style="flex:1; text-align:center; border:1px solid #D8C4A8; border-radius:8px; padding:10px; cursor:pointer;">
                <input type="radio" name="method" value="qris" style="margin-right:4px;">QRIS
            </label>
            <label style="flex:1; text-align:center; border:1px solid #D8C4A8; border-radius:8px; padding:10px; cursor:pointer;">
                <input type="radio" name="method" value="debit" style="margin-right:4px;">Debit
            </label>
        </div>

        <button type="submit" class="btn-primary">Konfirmasi pembayaran</button>
    </form>
</div>
{% endblock %}
