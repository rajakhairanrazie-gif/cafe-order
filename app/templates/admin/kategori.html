{% extends "base.html" %}

{% block title %}Kelola Kategori{% endblock %}

{% block content %}
<div class="header">
    <h1>Kelola kategori</h1>
</div>

<div class="container" style="max-width:720px;">
    {% include 'admin/_nav.html' %}

    <form method="POST" style="display:flex; gap:8px; margin-bottom:16px;">
        <input type="text" name="name" placeholder="Nama kategori baru" required style="flex:1; padding:10px; border-radius:8px; border:1px solid #D8C4A8;">
        <button type="submit" class="btn-primary" style="width:auto; margin-top:0; padding:10px 18px;">Tambah</button>
    </form>

    {% for category in categories %}
    <div class="menu-item">
        <div class="menu-item-info">
            <div class="menu-item-name">{{ category.name }}</div>
            <div style="font-size:12px; color: var(--cafe-wood-mid);">{{ category.products|length }} produk</div>
        </div>
        <form method="POST" action="{{ url_for('admin.kategori_hapus', category_id=category.id) }}" onsubmit="return confirm('Hapus kategori ini?');">
            <button type="submit" style="border:none; background:none; color: var(--cafe-terracotta); cursor:pointer; font-size:13px;">Hapus</button>
        </form>
    </div>
    {% else %}
        <p style="color: var(--cafe-wood-mid); text-align:center;">Belum ada kategori.</p>
    {% endfor %}
</div>
{% endblock %}
